name: Build Sokatito APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure release defaults
        run: |
          sed -i 's/preferences\[PreferencesKeys.AUTO_CHECK_APP_UPDATES\] ?: true/preferences[PreferencesKeys.AUTO_CHECK_APP_UPDATES] ?: false/' data/src/main/java/com/streamvault/data/preferences/PreferencesRepository.kt
          grep -q '<string name="app_name">Sokatito</string>' app/src/main/res/values/strings.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        env:
          KATITO_KEYSTORE_BASE64: ${{ secrets.KATITO_KEYSTORE_BASE64 }}
          KATITO_KEYSTORE_PASSWORD: ${{ secrets.KATITO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KATITO_KEYSTORE_BASE64" ] || [ -z "$KATITO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets KATITO_KEYSTORE_BASE64 and KATITO_KEYSTORE_PASSWORD are missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p keystore
          echo "$KATITO_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > keystore/katito.jks
          printf '%s\n' \
            'storeFile=keystore/katito.jks' \
            "storePassword=$KATITO_KEYSTORE_PASSWORD" \
            'keyAlias=katito' \
            "keyPassword=$KATITO_KEYSTORE_PASSWORD" > keystore.properties

      - name: Build optimized release APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain -PdistributionApplicationId=com.katito.app :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" out/Sokatito.apk
          ls -lh out/Sokatito.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sokatito-apk
          path: out/Sokatito.apk

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          METADATA=app/build/outputs/apk/release/output-metadata.json
          VERSION=$(jq -er '.elements | select(length == 1) | .[0].versionName | select(length > 0)' "$METADATA")
          CODE=$(jq -er '.elements[0].versionCode | numbers' "$METADATA")
          TAG="sokatito-build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}/v${VERSION}+${CODE}"
          gh release create "$TAG" out/Sokatito.apk \
            --repo "${{ github.repository }}" \
            --title "Sokatito $VERSION (build $CODE)" \
            --notes "Personal build of Sokatito (based on StreamVault by David Nashash). Download Sokatito.apk below." \
            --target "${{ github.sha }}"
